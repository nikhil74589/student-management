name: CI/CD Pipeline - Dev, QA, Prod

on:
  push:
    branches:
      - main
      - dev
      - qa
      - prod
  pull_request:
    branches:
      - main
      - dev
      - qa
      - prod  

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: us-central1-a

jobs:

  # ================= 1. BUILD & TEST =================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: |
          npm run lint || echo "Lint not configured"

      - name: Run Tests
        run: |
          npm test || echo "Tests not configured"

      - name: Build Application
        run: |
          npm run build || echo "Build script not configured"

  # ================= 2. DEV (vm-public, Port 3001) =================
  deploy-dev:
    name: Deploy Development
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: development
      url: https://dev-student.mydevops1.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/zone ${{ env.GCP_ZONE }}

      - name: Create .env
        run: |
          cat > .env <<EOF
          MONGO_URI=${{ secrets.DEV_MONGO_URI }}
          PORT=3001
          NODE_ENV=development
          ENVIRONMENT=dev
          EOF

      - name: Generate SSH Key for gcloud
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -f ~/.ssh/google_compute_engine -N "" -q
          chmod 400 ~/.ssh/google_compute_engine

      - name: Upload .env
        run: |
          gcloud compute scp .env vm-public:~/ \
            --zone=${{ env.GCP_ZONE }} \
            --quiet

      - name: Deploy Dev
        run: |
          gcloud compute ssh vm-public \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="bash -lc '
              if [ ! -d ~/student-management ]; then
                git clone https://github.com/${{ github.repository }}.git ~/student-management
              fi
              cd ~/student-management
              git fetch origin
              git pull origin ${{ github.ref_name }}
              npm ci
              cp ~/.env ./.env
              pm2 delete student-app-dev || true
              pm2 start server.js --name student-app-dev --update-env
              pm2 save
            '"

      - name: Health Check (Dev)
        run: |
          sleep 10
          VM_IP=$(gcloud compute instances describe vm-public --zone=${{ env.GCP_ZONE }} --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          curl --retry 5 --retry-delay 5 --fail --resolve dev-student.mydevops1.xyz:443:$VM_IP https://dev-student.mydevops1.xyz

  # ================= 3. QA (vm-public, Port 3002) =================
  deploy-qa:
    name: Deploy QA
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: qa
      url: https://qa-student.mydevops1.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/zone ${{ env.GCP_ZONE }}

      - name: Create .env
        run: |
          cat > .env <<EOF
          MONGO_URI=${{ secrets.QA_MONGO_URI }}
          PORT=3002
          NODE_ENV=staging
          ENVIRONMENT=qa
          EOF

      - name: Generate SSH Key for gcloud
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -f ~/.ssh/google_compute_engine -N "" -q
          chmod 400 ~/.ssh/google_compute_engine

      - name: Upload .env
        run: |
          gcloud compute scp .env vm-public:~/ \
            --zone=${{ env.GCP_ZONE }} \
            --quiet

      - name: Deploy QA
        run: |
          gcloud compute ssh vm-public \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="bash -lc '
              if [ ! -d ~/student-management ]; then
                git clone https://github.com/${{ github.repository }}.git ~/student-management
              fi
              cd ~/student-management
              git fetch origin
              git pull origin ${{ github.ref_name }}
              npm ci
              cp ~/.env ./.env
              pm2 delete student-app-qa || true
              pm2 start server.js --name student-app-qa --update-env
              pm2 save
              pm2 status
            '"

      - name: Health Check (QA)
        run: |
          sleep 10
          VM_IP=$(gcloud compute instances describe vm-public --zone=${{ env.GCP_ZONE }} --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          curl --retry 5 --retry-delay 5 --fail --resolve qa-student.mydevops1.xyz:443:$VM_IP https://qa-student.mydevops1.xyz

  # ================= 4. PRODUCTION (vm-public, Port 3000) =================
  deploy-prod:
    name: Deploy Production
    needs: deploy-qa
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://student.mydevops1.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/zone ${{ env.GCP_ZONE }}

      - name: Create Production .env
        run: |
          cat > .env <<EOF
          MONGO_URI=${{ secrets.PROD_MONGO_URI }}
          PORT=3000
          NODE_ENV=production
          ENVIRONMENT=prod
          EOF

      - name: Generate SSH Key for gcloud
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -f ~/.ssh/google_compute_engine -N "" -q
          chmod 400 ~/.ssh/google_compute_engine

      - name: Upload .env
        run: |
          gcloud compute scp .env vm-public:~/ \
            --zone=${{ env.GCP_ZONE }} \
            --quiet

      - name: Deploy Production
        run: |
          gcloud compute ssh vm-public \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="bash -lc '
              if [ ! -d ~/student-management ]; then
                git clone https://github.com/${{ github.repository }}.git ~/student-management
              else
                cp -r ~/student-management ~/student-management-backup-\$(date +%s)
              fi

              cd ~/student-management
              git config --global --add safe.directory ~/student-management
              git fetch origin
              git pull origin ${{ github.ref_name }}
              npm ci
              cp ~/.env ./.env

              if pm2 describe student-app >/dev/null 2>&1; then
                pm2 restart student-app --update-env
              else
                pm2 start server.js --name student-app --update-env
              fi

              pm2 save
              pm2 status
            '"

      - name: Production Health Check
        run: |
          sleep 10
          VM_IP=$(gcloud compute instances describe vm-public --zone=${{ env.GCP_ZONE }} --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          curl --retry 10 --retry-delay 5 --fail --resolve student.mydevops1.xyz:443:$VM_IP https://student.mydevops1.xyz

      - name: Create Release Tag
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag -a v${{ github.run_number }} \
            -m "Production Release v${{ github.run_number }}" || true
          git push origin v${{ github.run_number }} || true

      - name: Rollback on Failure
        if: failure()
        run: |
          gcloud compute ssh vm-public \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="bash -lc '
              cd ~
              LATEST_BACKUP=\$(ls -dt student-management-backup-* 2>/dev/null | head -1)

              if [ -n \"\$LATEST_BACKUP\" ]; then
                rm -rf ~/student-management
                mv \$LATEST_BACKUP ~/student-management
                cd ~/student-management
                pm2 restart student-app --update-env
                pm2 save
                echo \"Rollback Completed\"
              else
                echo \"No Backup Found\"
              fi
            '"
