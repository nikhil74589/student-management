name: CI/CD Pipeline - Dev, QA, Prod

on:
  push:
    branches:
      - develop
      - staging
      - main

  pull_request:
    branches:
      - develop
      - staging
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: us-central1-a

jobs:

  # ================= BUILD =================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: |
          npm run lint || echo "Lint not configured"

      - name: Run Tests
        run: |
          npm test || echo "Tests not configured"

      - name: Build Application
        run: |
          npm run build || echo "Build script not configured"

  # ================= DEV =================
  deploy-dev:
    name: Deploy Development
    needs: build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    environment:
      name: development
      url: http://dev-student.mydevops1.xyz

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # FIXED AUTHENTICATION
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/zone ${{ env.GCP_ZONE }}
          gcloud auth list
      - name: Check Authenticated Account
        run: |
          gcloud auth list
          gcloud config list

      - name: Create .env
        run: |
          cat > .env <<EOF
          MONGO_URI=${{ secrets.DEV_MONGO_URI }}
          PORT=3001
          NODE_ENV=development
          ENVIRONMENT=dev
          EOF

      - name: Upload .env
        run: | 
          gcloud compute scp .env vm-dev:~/ \
            --zone=${{ env.GCP_ZONE }} \
            --quiet

      - name: Deploy Dev
        run: |
          gcloud compute ssh vm-dev \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="
              cd ~/student-management &&
              git fetch origin &&
              git checkout develop &&
              git pull origin develop &&
              npm ci &&
              cp ~/.env ./.env &&
              pm2 delete student-app-dev || true &&
              pm2 start server.js --name student-app-dev --update-env &&
              pm2 save
            "

      - name: Health Check
        run: |
          sleep 10
          curl --retry 5 --retry-delay 5 --fail http://dev-student.mydevops1.xyz
            # ================= QA =================
  deploy-qa:
    name: Deploy QA
    needs: build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    environment:
      name: qa
      url: http://qa-student.mydevops1.xyz

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # FIXED AUTHENTICATION
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/zone ${{ env.GCP_ZONE }}
          gcloud auth list

      - name: Create .env
        run: |
          cat > .env <<EOF
          MONGO_URI=${{ secrets.QA_MONGO_URI }}
          PORT=3002
          NODE_ENV=staging
          ENVIRONMENT=qa
          EOF

      - name: Upload .env
        run: |
          gcloud compute scp .env vm-qa:~/ \
            --zone=${{ env.GCP_ZONE }} \
            --quiet

      - name: Deploy QA
        run: |
          gcloud compute ssh vm-qa \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="
              cd ~/student-management &&
              git fetch origin &&
              git checkout staging &&
              git pull origin staging &&
              npm ci &&
              cp ~/.env ./.env &&
              pm2 delete student-app-qa || true &&
              pm2 start server.js --name student-app-qa --update-env &&
              pm2 save &&
              pm2 status
            "

      - name: Health Check
        run: |
          sleep 10
          curl --retry 5 \
               --retry-delay 5 \
               --fail \
               http://qa-student.mydevops1.xyz
                # ================= PRODUCTION =================
  deploy-prod:
    name: Deploy Production
    needs: build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://student.mydevops1.xyz

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set compute/zone ${{ env.GCP_ZONE }}
          gcloud auth list

      - name: Create Production .env
        run: |
          cat > .env <<EOF
          MONGO_URI=${{ secrets.PROD_MONGO_URI }}
          PORT=3000
          NODE_ENV=production
          ENVIRONMENT=prod
          EOF

      - name: Debug VM
        run: |
          gcloud compute ssh vm-public \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="pwd && whoami && echo HOME=\$HOME && ls -la \$HOME && find \$HOME -maxdepth 2 -type d"

      - name: Upload .env
        run: |
          gcloud compute scp .env vm-public:~/ \
            --zone=${{ env.GCP_ZONE }} \
            --quiet

      - name: Deploy Production
        run: |
          gcloud compute ssh vm-public \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="
              cd /home/nikhil_ranjan/student-management &&
              git fetch origin &&
              git checkout main &&
              git pull origin main &&
              npm ci &&
              cp /home/YOUR_VM_USERNAME/.env ./.env &&
              if pm2 describe student-app >/dev/null 2>&1; then
                pm2 restart student-app --update-env
              else
                pm2 start server.js --name student-app --update-env
              fi &&
              pm2 save &&
              pm2 status
            "

      - name: Production Health Check
        run: |
          sleep 10
          curl --retry 10 \
               --retry-delay 5 \
               --fail \
               https://student.mydevops1.xyz

      - name: Create Release Tag
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag -a v${{ github.run_number }} \
            -m "Production Release v${{ github.run_number }}" || true
          git push origin v${{ github.run_number }} || true

      - name: Rollback on Failure
        if: failure()
        run: |
          gcloud compute ssh vm-public \
            --zone=${{ env.GCP_ZONE }} \
            --quiet \
            --command="
              cd ~ &&
              LATEST_BACKUP=\$(ls -dt student-management-backup-* | head -1)

              if [ -n \"\$LATEST_BACKUP\" ]; then
                rm -rf ~/student-management
                mv \$LATEST_BACKUP ~/student-management
                cd ~/student-management
                pm2 restart student-app --update-env
                pm2 save
                echo Rollback Completed
              else
                echo No Backup Found
              fi
            "
