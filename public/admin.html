<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Library Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 40px; }

        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .btn-exit { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; }

        /* Admin Info Bar Settings Card */
        .admin-settings-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 16px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .setting-fields { display: flex; gap: 15px; flex-wrap: wrap; }
        .setting-fields input { background: #0f172a; border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; width: 220px; }
        .btn-save-settings { background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 16px; border-left: 5px solid var(--primary); }
        .stat-card h4 { margin: 0 0 5px 0; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
        .stat-card .val { font-size: 26px; font-weight: 800; }

        /* Controls */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(15,23,42,0.8); padding: 12px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .btn-del { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; }
        .btn-del:hover { background: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="navbar">
    <h2><i class="fa-solid fa-user-gear" style="color:#818cf8;"></i> Library Admin Management Console</h2>
    <button class="btn-exit" onclick="logout()">Exit Admin</button>
</div>

<div class="container">
    <!-- ADMIN CONTACT SETTINGS UPDATE -->
    <div class="admin-settings-card">
        <div>
            <h4 style="margin:0; font-size:15px;"><i class="fa-solid fa-address-card" style="color:#38bdf8;"></i> Update Header Contact Info</h4>
            <small style="color:var(--text-muted);">Change phone number & email shown on public portal</small>
        </div>
        <div class="setting-fields">
            <input type="text" id="adminPhoneInput" placeholder="Admin Mobile Number">
            <input type="email" id="adminEmailInput" placeholder="Admin Email ID">
            <button class="btn-save-settings" onclick="saveAdminSettings()">Save Info</button>
        </div>
    </div>

    <!-- COUNTERS -->
    <div class="stats-grid">
        <div class="stat-card" style="border-color: #6366f1;">
            <h4>Total Registered</h4>
            <div class="val" id="totalCnt">0</div>
        </div>
        <div class="stat-card" style="border-color: #f59e0b;">
            <h4>Premium Members</h4>
            <div class="val" id="premCnt">0</div>
        </div>
        <div class="stat-card" style="border-color: #10b981;">
            <h4>Basic Free Members</h4>
            <div class="val" id="freeCnt">0</div>
        </div>
    </div>

    <!-- TABLE -->
    <div style="background:var(--surface); padding:20px; border-radius:16px; border:1px solid var(--border);">
        <h3 style="margin-top:0;">Database Master Control</h3>
        <table>
            <thead>
                <tr>
                    <th>Student Info</th>
                    <th>Contact Info</th>
                    <th>Membership</th>
                    <th>Admin Action</th>
                </tr>
            </thead>
            <tbody id="adminTbody"></tbody>
        </table>
    </div>
</div>

<script>
    if (sessionStorage.getItem('adminAuth') !== 'true') {
        window.location.href = '/';
    }

    function logout() {
        sessionStorage.removeItem('adminAuth');
        window.location.href = '/';
    }

    function loadSettings() {
        document.getElementById('adminPhoneInput').value = localStorage.getItem('admin_phone') || '+91 98765 43210';
        document.getElementById('adminEmailInput').value = localStorage.getItem('admin_email') || 'admin@library.com';
    }

    function saveAdminSettings() {
        const phone = document.getElementById('adminPhoneInput').value.trim();
        const email = document.getElementById('adminEmailInput').value.trim();
        localStorage.setItem('admin_phone', phone);
        localStorage.setItem('admin_email', email);
        alert("✅ Admin Contact Info Updated Successfully!");
    }

    async function loadAdminData() {
        const res = await fetch('/api/students');
        const data = await res.json();

        document.getElementById('totalCnt').innerText = data.length;
        document.getElementById('premCnt').innerText = data.filter(s => s.membership === 'Premium').length;
        document.getElementById('freeCnt').innerText = data.filter(s => s.membership !== 'Premium').length;

        const tbody = document.getElementById('adminTbody');
        tbody.innerHTML = '';
        data.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${s.fullName || s.name || 'N/A'}</b><br><small style="color:var(--text-muted);">${s.degree || ''}</small></td>
                <td>${s.email || ''}<br><small style="color:var(--text-muted);">${s.mobile || ''}</small></td>
                <td>${s.membership || 'Basic'}</td>
                <td><button class="btn-del" onclick="deleteRec('${s._id}')"><i class="fa-solid fa-trash"></i> Delete</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function deleteRec(id) {
        if(!confirm("Permanently delete this student?")) return;
        await fetch(`/api/students/${id}`, { method: 'DELETE' });
        loadAdminData();
    }

    loadSettings();
    loadAdminData();
</script>
</body>
</html>
