<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        
        /* Side-by-Side Flex Layout */
        .wrapper { display: flex; gap: 20px; max-width: 1200px; margin: auto; align-items: flex-start; }
        
        .form-card { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); min-width: 320px; }
        .table-card { flex: 1.5; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow-x: auto; }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        .btn-submit { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-submit:hover { background-color: #218838; }
        .btn-cancel { width: 100%; padding: 8px; background-color: #6c757d; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 5px; display: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .btn-edit { background-color: #ffc107; color: #000; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-weight: bold; margin-right: 4px; }
        .btn-delete { background-color: #dc3545; color: #fff; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .btn-edit:hover { background-color: #e0a800; }
        .btn-delete:hover { background-color: #c82333; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .wrapper { flex-direction: column; }
            .form-card, .table-card { width: 100%; }
        }
    </style>
</head>
<body>

<h2>Student Management Portal</h2>

<div class="wrapper">
    <!-- LEFT SIDE: FORM -->
    <div class="form-card">
        <h3 id="formHeading" style="margin-top:0;">Add Student</h3>
        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required>
            </div>

            <div class="form-group">
                <label for="fatherName">Father's Name</label>
                <input type="text" id="fatherName">
            </div>

            <div class="form-group">
                <label for="degree">Degree</label>
                <input type="text" id="degree">
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="text" id="mobile">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label for="address">Address / City</label>
                <input type="text" id="address">
            </div>

            <div class="form-group">
                <label for="background">Background</label>
                <input type="text" id="background">
            </div>

            <div class="form-group">
                <label for="membership">Membership</label>
                <select id="membership">
                    <option value="Basic (Free)">Basic (Free)</option>
                    <option value="Premium">Premium</option>
                </select>
            </div>

            <div class="form-group">
                <label for="freeBook">Free Book Option</label>
                <select id="freeBook">
                    <option value="None">None</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Details</button>
            <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
        </form>
    </div>

    <!-- RIGHT SIDE: TABLE -->
    <div class="table-card">
        <h3 style="margin-top:0;">Registered Students</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Address / City</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Data populated dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let studentsCache = [];

    function resetForm() {
        document.getElementById('studentForm').reset();
        document.getElementById('studentId').value = '';
        document.getElementById('submitBtn').innerText = 'Submit Details';
        document.getElementById('formHeading').innerText = 'Add Student';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    async function fetchStudents() {
        try {
            const res = await fetch('/api/students');
            studentsCache = await res.json();
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            
            if (studentsCache.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records found.</td></tr>';
                return;
            }

            studentsCache.forEach(student => {
                const tr = document.createElement('tr');
                const displayName = student.fullName || student.name || 'N/A';
                const displayAddress = student.address || student.city || 'N/A';
                
                tr.innerHTML = `
                    <td><b>${displayName}</b></td>
                    <td>${student.email || 'N/A'}</td>
                    <td>${displayAddress}</td>
                    <td style="white-space:nowrap;">
                        <button class="btn-edit" onclick="editStudent('${student._id}')">Edit</button>
                        <button class="btn-delete" onclick="deleteStudent('${student._id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.error("Error fetching students:", err);
        }
    }

    function editStudent(id) {
        const student = studentsCache.find(s => s._id === id);
        if (!student) return;

        document.getElementById('studentId').value = student._id;
        document.getElementById('fullName').value = student.fullName || student.name || '';
        document.getElementById('fatherName').value = student.fatherName || '';
        document.getElementById('degree').value = student.degree || '';
        document.getElementById('mobile').value = student.mobile || '';
        document.getElementById('email').value = student.email || '';
        document.getElementById('address').value = student.address || student.city || '';
        document.getElementById('background').value = student.background || '';
        document.getElementById('membership').value = student.membership || 'Basic (Free)';
        document.getElementById('freeBook').value = student.freeBook || 'None';

        document.getElementById('submitBtn').innerText = 'Update Details';
        document.getElementById('formHeading').innerText = 'Edit Student';
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteStudent(id) {
        if (!confirm("Are you sure you want to delete this student?")) return;

        try {
            const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert("Student deleted successfully!");
                fetchStudents();
            } else {
                alert("Failed to delete record!");
            }
        } catch (err) {
            console.error("Delete error:", err);
            alert("Error deleting record!");
        }
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('studentId').value;
        const fullNameVal = document.getElementById('fullName').value.trim();
        const addressVal = document.getElementById('address').value.trim();

        const studentData = {
            fullName: fullNameVal,
            name: fullNameVal,
            address: addressVal,
            city: addressVal,
            fatherName: document.getElementById('fatherName').value.trim(),
            degree: document.getElementById('degree').value.trim(),
            mobile: document.getElementById('mobile').value.trim(),
            email: document.getElementById('email').value.trim(),
            background: document.getElementById('background').value.trim(),
            membership: document.getElementById('membership').value,
            freeBook: document.getElementById('freeBook').value
        };

        try {
            const isEdit = Boolean(id);
            const url = isEdit ? `/api/students/${id}` : '/api/students';
            const method = isEdit ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            });

            if (!res.ok) {
                alert("Error saving details!");
                return;
            }

            alert(isEdit ? "Student details updated!" : "Student added successfully!");
            resetForm();
            fetchStudents();

        } catch (err) {
            console.error("Submit Error:", err);
            alert("Network/Server Error occurred!");
        }
    });

    // Initial fetch
    fetchStudents();
</script>

</body>
</html>
