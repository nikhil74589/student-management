<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #74ebe5 0%, #899fd4 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
        }
        .main-card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: rgba(255, 255, 255, 0.95);
            border: none;
        }
        .header-bg {
            background: #2c3e50;
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .badge-admin {
            background-color: #e74c3c;
        }
        .badge-user {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- Top Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white rounded shadow-sm">
        <h2 class="m-0 text-primary"><i class="fas fa-user-graduate me-2"></i>Student Portal</h2>
        <div>
            <span id="roleBadge" class="badge badge-user p-2 me-2"><i class="fas fa-user me-1"></i>User Mode</span>
            <button id="adminToggleBtn" onclick="toggleAdminMode()" class="btn btn-outline-dark btn-sm">
                <i class="fas fa-lock me-1"></i>Switch to Admin
            </button>
        </div>
    </div>

    <div class="row g-4">
        <!-- Student Form -->
        <div class="col-lg-5">
            <div class="card main-card">
                <div class="card-header header-bg p-3">
                    <h5 class="m-0"><i class="fas fa-pen-to-square me-2"></i><span id="formTitle">Student Registration</span></h5>
                </div>
                <div class="card-body p-4">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        
                        <div class="mb-2">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" id="fullName" class="form-control form-control-sm" required placeholder="John Doe">
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold">Father's Name</label>
                            <input type="text" id="fatherName" class="form-control form-control-sm" required placeholder="Father Name">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-bold">Degree</label>
                                <select id="degree" class="form-select form-select-sm" required>
                                    <option value="">Select Degree</option>
                                    <option value="B.Tech / B.E">B.Tech / B.E</option>
                                    <option value="B.Sc / M.Sc">B.Sc / M.Sc</option>
                                    <option value="BCA / MCA">BCA / MCA</option>
                                    <option value="Diploma">Diploma</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-bold">Mobile</label>
                                <input type="tel" id="mobile" class="form-control form-control-sm" required placeholder="10-digit number">
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" id="email" class="form-control form-control-sm" required placeholder="email@domain.com">
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold">Full Address</label>
                            <textarea id="address" class="form-control form-control-sm" rows="2" required placeholder="City, State, Pin Code"></textarea>
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold">Background</label>
                            <input type="text" id="background" class="form-control form-control-sm" required placeholder="CS / IT / Non-IT">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-bold">Book Membership</label>
                                <select id="membership" class="form-select form-select-sm">
                                    <option value="Basic (Free)">Basic (Free)</option>
                                    <option value="Standard ($10/mo)">Standard ($10/mo)</option>
                                    <option value="VIP Premium">VIP Premium</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label fw-bold">Free Book Claim</label>
                                <select id="freeBook" class="form-select form-select-sm">
                                    <option value="None">None</option>
                                    <option value="DevOps Handbook">DevOps Handbook</option>
                                    <option value="Clean Code Guide">Clean Code Guide</option>
                                    <option value="Node.js Architecture">Node.js Architecture</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-3">
                            <button type="submit" id="submitBtn" class="btn btn-success fw-bold"><i class="fas fa-plus me-1"></i>Submit Details</button>
                            <button type="button" id="cancelBtn" onclick="resetForm()" class="btn btn-secondary btn-sm d-none">Cancel Edit</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Admin Contact Widget -->
            <div class="card main-card mt-3 p-3">
                <div class="d-flex align-items-center">
                    <i class="fas fa-headset fa-2x text-primary me-3"></i>
                    <div>
                        <h6 class="m-0 fw-bold">Admin Support Contact</h6>
                        <small class="text-muted"><i class="fas fa-phone me-1"></i>+91 98765 43210 | <i class="fas fa-envelope me-1"></i>support@mydevops1.xyz</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Student List -->
        <div class="col-lg-7">
            <div class="card main-card">
                <div class="card-header header-bg p-3 d-flex justify-content-between align-items-center">
                    <h5 class="m-0"><i class="fas fa-list me-2"></i>Registered Students</h5>
                    <button class="btn btn-sm btn-light" onclick="fetchStudents()"><i class="fas fa-rotate me-1"></i>Refresh</button>
                </div>
                <div class="card-body p-2">
                    <div class="table-responsive" style="max-height: 520px;">
                        <table class="table table-hover table-striped align-middle" style="font-size: 0.85rem;">
                            <thead class="table-dark">
                                <tr>
                                    <th>Name / Father</th>
                                    <th>Contact</th>
                                    <th>Degree / Bg</th>
                                    <th>Membership</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentTableBody">
                                <!-- Data populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let isAdmin = false;
    let myCreatedIds = JSON.parse(localStorage.getItem('myStudentIds') || "[]");

    document.addEventListener("DOMContentLoaded", fetchStudents);

    function toggleAdminMode() {
        if (!isAdmin) {
            let pass = prompt("Enter Admin Password:");
            if (pass === "admin123") {
                isAdmin = true;
                document.getElementById("roleBadge").className = "badge badge-admin p-2 me-2";
                document.getElementById("roleBadge").innerHTML = '<i class="fas fa-user-shield me-1"></i>Admin Mode';
                document.getElementById("adminToggleBtn").innerText = "Exit Admin Mode";
                alert("Admin Access Granted!");
            } else {
                alert("Incorrect Password!");
            }
        } else {
            isAdmin = false;
            document.getElementById("roleBadge").className = "badge badge-user p-2 me-2";
            document.getElementById("roleBadge").innerHTML = '<i class="fas fa-user me-1"></i>User Mode';
            document.getElementById("adminToggleBtn").innerText = "Switch to Admin";
        }
        fetchStudents();
    }

    async function fetchStudents() {
        try {
            const res = await fetch('/api/students');
            const students = await res.json();
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';

            if(students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No student records found.</td></tr>`;
                return;
            }

            students.forEach(s => {
                const isOwner = myCreatedIds.includes(s._id);
                const canDelete = isAdmin || isOwner;
                const canEdit = isOwner || isAdmin;

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong>${s.fullName}</strong><br>
                            <small class="text-muted">S/O: ${s.fatherName}</small>
                        </td>
                        <td>
                            <i class="fas fa-envelope text-muted me-1"></i>${s.email}<br>
                            <i class="fas fa-phone text-muted me-1"></i>${s.mobile}
                        </td>
                        <td>
                            <span class="badge bg-info text-dark">${s.degree}</span><br>
                            <small class="text-muted">${s.background}</small>
                        </td>
                        <td>
                            <span class="badge bg-secondary">${s.membership}</span><br>
                            <small class="text-success"><i class="fas fa-book me-1"></i>${s.freeBook}</small>
                        </td>
                        <td>
                            ${canEdit ? `<button class="btn btn-warning btn-sm py-0 px-1 mb-1" onclick="editStudent('${s._id}', '${s.fullName}', '${s.fatherName}', '${s.degree}', '${s.mobile}', '${s.email}', '${s.address}', '${s.background}', '${s.membership}', '${s.freeBook}')"><i class="fas fa-edit"></i></button>` : ''}
                            ${canDelete ? `<button class="btn btn-danger btn-sm py-0 px-1" onclick="deleteStudent('${s._id}')"><i class="fas fa-trash"></i></button>` : '<span class="text-muted"><i class="fas fa-lock"></i></span>'}
                        </td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error('Error:', err);
        }
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('studentId').value;

        const studentData = {
            fullName: document.getElementById('fullName').value,
            fatherName: document.getElementById('fatherName').value,
            degree: document.getElementById('degree').value,
            mobile: document.getElementById('mobile').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            background: document.getElementById('background').value,
            membership: document.getElementById('membership').value,
            freeBook: document.getElementById('freeBook').value
        };

        if (id) {
            // Update Existing
            await fetch(`/api/students/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            });
        } else {
            // Create New
            const res = await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            });
            const created = await res.json();
            myCreatedIds.push(created._id);
            localStorage.setItem('myStudentIds', JSON.stringify(myCreatedIds));
        }

        resetForm();
        fetchStudents();
    });

    function editStudent(id, name, fName, deg, mob, mail, addr, bg, mem, book) {
        document.getElementById('studentId').value = id;
        document.getElementById('fullName').value = name;
        document.getElementById('fatherName').value = fName;
        document.getElementById('degree').value = deg;
        document.getElementById('mobile').value = mob;
        document.getElementById('email').value = mail;
        document.getElementById('address').value = addr;
        document.getElementById('background').value = bg;
        document.getElementById('membership').value = mem;
        document.getElementById('freeBook').value = book;

        document.getElementById('formTitle').innerText = "Edit Student Details";
        document.getElementById('submitBtn').innerText = "Update Details";
        document.getElementById('cancelBtn').classList.remove('d-none');
    }

    function resetForm() {
        document.getElementById('studentForm').reset();
        document.getElementById('studentId').value = '';
        document.getElementById('formTitle').innerText = "Student Registration";
        document.getElementById('submitBtn').innerText = "Submit Details";
        document.getElementById('cancelBtn').classList.add('d-none');
    }

    async function deleteStudent(id) {
        if (confirm("Are you sure you want to delete this record?")) {
            await fetch(`/api/students/${id}`, { method: 'DELETE' });
            myCreatedIds = myCreatedIds.filter(i => i !== id);
            localStorage.setItem('myStudentIds', JSON.stringify(myCreatedIds));
            fetchStudents();
        }
    }
</script>
</body>
</html>
